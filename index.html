<!DOCTYPE html>
<html lang="fa" dir="rtl" data-base="./">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد حمزه | بنیان‌گذار استارتیچ</title>
    <meta name="description" content="بنیان‌گذار استارتیچ؛ مدیر پروژه و توسعه‌دهنده محصولات دیجیتال — وب، اندروید، Flutter، Kotlin و PWA. از ایده تا تجاری‌سازی.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://m-hamza.ir/">
    <link rel="alternate" hreflang="fa" href="https://m-hamza.ir/">
    <link rel="alternate" hreflang="en" href="https://m-hamza.ir/?lang=en">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="loading" id="loadingIndicator">
        <div class="loading-spinner"></div>
    </div>

    <div class="container page-wrap">
        <div class="topbar">
            <a class="topbar-brand" href="./">
                <img src="gibli.jpg" alt="">
                <span id="brandName">محمد حمزه</span>
            </a>
            <div class="topbar-actions">
                <div class="lang-switch" id="langSwitch"></div>
            </div>
        </div>

        <header id="main-info" class="hero">
            <div class="hero-grid">
                <div class="hero-visual">
                    <img src="gibli.jpg" alt="عکس پروفایل" class="profile-image lazy-load" loading="lazy">
                    <div class="hero-stats" id="heroStats"></div>
                </div>
                <div class="hero-content">
                    <h1 id="name"></h1>
                    <p class="headline" id="headline"></p>
                    <p class="hero-meta" id="heroMeta"></p>
                    <p class="description" id="description"></p>
                    <div class="hero-actions" id="heroActions"></div>
                    <div class="social-links" id="socialLinks"></div>
                </div>
            </div>
        </header>

        <div class="tabs-container page-tabs" id="mainTabs">
        <nav class="tab-nav section-nav no-print" id="sectionNav" aria-label="ناوبری صفحه"></nav>

        <main class="tab-content page-sections">
            <section id="contact-tab" class="tab-pane active page-section">
                <div class="section-header">
                    <h2 id="contactTitle"><i class="fas fa-envelope"></i> تماس</h2>
                </div>
                <div id="contactContent" class="contact-grid"></div>
            </section>

            <section id="projects-tab" class="tab-pane page-section">
                <div class="section-header">
                    <h2 id="projectsTitle"><i class="fas fa-briefcase"></i> پروژه‌ها</h2>
                    <p class="section-lead" id="projectsLead"></p>
                </div>
                <section class="starteach-hub" id="starteachHub"></section>
                <div class="project-filters" id="projectFilters"></div>
                <div class="project-grid" id="siteList"></div>
            </section>

            <section id="services-tab" class="tab-pane page-section">
                <div class="section-header">
                    <h2 id="servicesTitle"><i class="fas fa-handshake"></i> خدمات</h2>
                    <p class="section-lead" id="servicesLead"></p>
                </div>
                <div class="service-grid" id="servicesList"></div>
            </section>

            <section id="timeline-tab" class="tab-pane page-section">
                <div class="section-header">
                    <h2 id="timelineTitle"><i class="fas fa-stream"></i> تایم‌لاین فعالیت‌ها</h2>
                    <p class="section-lead" id="timelineLead"></p>
                </div>
                <div class="timeline-filters no-print" id="timelineFilters"></div>
                <div class="activity-timeline" id="activityTimeline"></div>
            </section>

            <section id="profile-tab" class="tab-pane page-section">
                <div class="section-header">
                    <h2 id="profileTitle"><i class="fas fa-user"></i> پروفایل</h2>
                </div>
                <div id="profileContent"></div>
            </section>

        </main>
        </div>

        <footer>
            <div class="footer-contacts" id="footerContacts"></div>
            <p id="footerCopy"></p>
        </footer>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="modal fade" id="siteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-header-info">
                        <img id="siteModalIcon" class="modal-app-icon" src="" alt="" hidden>
                        <div>
                            <h5 class="modal-title" id="siteModalLabel"></h5>
                            <span class="modal-status" id="siteModalStatus"></span>
                        </div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="siteModalBody"></div>
                <div class="modal-footer" id="siteModalFooter"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/home.js"></script>
</body>
</html>
