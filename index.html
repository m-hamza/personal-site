<!DOCTYPE html>
<html lang="fa" dir="rtl" data-base="./">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد حمزه | توسعه‌دهنده وب</title>
    <meta name="description" content="سایت شخصی محمد حمزه؛ توسعه وب، اندروید، دیجیتال مارکتینگ و ارائه خدمات برای پروژه‌های داخلی و بین‌المللی.">
    <link rel="alternate" hreflang="fa" href="https://m-hamza.ir/">
    <link rel="alternate" hreflang="en" href="https://m-hamza.ir/?lang=en">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="loading" id="loadingIndicator">
        <div class="loading-spinner"></div>
    </div>

    <div class="container page-wrap">
        <div class="topbar">
            <a class="topbar-brand" href="./">
                <img src="gibli.jpg" alt="">
                <span id="brandName">محمد حمزه</span>
            </a>
            <div class="topbar-actions">
                <div class="lang-switch" id="langSwitch"></div>
            </div>
        </div>

        <header id="main-info">
            <img src="gibli.jpg" alt="عکس پروفایل" class="profile-image lazy-load" loading="lazy">
            <h1 id="name"></h1>
            <p class="headline" id="headline"></p>
            <p class="description" id="description"></p>
            <div class="hero-actions" id="heroActions"></div>
            <div class="social-links" id="socialLinks"></div>
        </header>

        <main class="tabs-container">
            <nav class="tab-nav" id="tabNav"></nav>
            <div class="tab-content">
                <div id="projects-tab" class="tab-pane active">
                    <div class="project-grid" id="siteList"></div>
                </div>
                <div id="services-tab" class="tab-pane">
                    <div class="service-grid" id="servicesList"></div>
                </div>
                <div id="about-tab" class="tab-pane">
                    <div id="aboutContent" class="content-card"></div>
                </div>
                <div id="contact-tab" class="tab-pane">
                    <div id="contactContent" class="content-card"></div>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-contacts" id="footerContacts"></div>
            <p id="footerCopy"></p>
        </footer>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="modal fade" id="siteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="siteModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="siteModalBody"></div>
                <div class="modal-footer">
                    <a href="#" id="siteLink" class="modal-btn" target="_blank" rel="noopener noreferrer"></a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/home.js"></script>
</body>
</html>
